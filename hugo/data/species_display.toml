# Multi-Species Genomic Data Portal Configuration
# All dash_url entries point to the unified dashboard served via Nginx:
# use relative paths like /miniodp/dash/{species_key} for environment portability.

[smeliloti]
name = "Sinorhizobium meliloti "
scientific_name = "Sinorhizobium meliloti "
