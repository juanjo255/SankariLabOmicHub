baseURL = "https://example.org/miniodp/"  # Override per deployment with Hugo --baseURL or an untracked local config file.
locale = "en-US"
title = "Sankari Lab Omics Hub"

[params]
  description = "A simple and efficient multi-species multi-omics data portal"
  author = "Sankari Lab"
  author_url = "https://labs.stowers.org/sankari"
  citation_text = "Please cite our portal as: \"Sankari Lab Omics Hub. Sankari Lab, Stowers Institute for Medical Research.\""
  contact_name = "Sankari Lab"
  contact_url = "https://labs.stowers.org/sankari"
  contact_affiliation_line1 = "Stowers Institute for Medical Research"
  
  # Theme configuration - Change this to switch themes
  # Available themes: classic-blue, classic-green, emerald-science, royal-purple, warm-orange, cool-gray, elegant-blue
  theme = "classic-green"
  
  # Dash application configuration (environment override only needs to modify url_prefix/host/port)
  [params.dash_config]
    url_prefix = "miniodp/dash"
    host = "127.0.0.1"
    port = 3939
    debug = false
    data_path = "data"

  # JBrowse config example (environment overrides base_path)
  [params.jbrowse]
    base_path = "/miniodp/jbrowse2/"

  # SequenceServer reverse proxy and listening port config
  [params.sequenceserver]
    base_path = "/miniodp/sequenceserver/"
    host = "127.0.0.1"
    port = 4567

[menu]
  [[menu.main]]
    name = "Help"
    url = "/help/"
    weight = 1
  [[menu.main]]
    name = "Sankari Lab"
    url = "https://labs.stowers.org/sankari"
    weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  # keep Hugo's default project mounts
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  # extra: expose the JBrowse 2 app at /jbrowse2/ (=> /miniodp/jbrowse2/ with baseURL prefix)
  # so `hugo server` can show the Genome Browser tab locally, and a plain
  # `hugo` build produces a self-contained portal (Hugo + JBrowse in one public/).
  [[module.mounts]]
    source = "../jbrowse2/app"
    target = "static/jbrowse2"
